name: Deploy to GitHub Pages

# Builds and deploys the static site to GitHub Pages.
# Requires: repo Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches:
      - claude/essential-songs-app-glvo7u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time. Do NOT cancel an in-progress run:
# killing a deploy mid-publish orphans the Pages deployment and jams the
# environment. Newer runs queue politely behind the active one instead.
# (Group renamed from "pages" to orphan a permanently-wedged zombie run that
# was blocking the old group.)
concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # fail fast instead of zombie-waiting in a jammed queue
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
